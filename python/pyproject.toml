[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-rca"
version = "1.0.0"
description = "Python client, CLI and terminal visualizer for Argus distributed trace RCA engine"
readme = "README.md"
authors = [{ name = "Aneesh Krishna", email = "aneeshkrishnaparthasarathy@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Prolog",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "click>=8.0",
    "rich>=12.0",
    "tabulate>=0.9"
]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
